<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una sorpresa para vos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PARA EDITAR EL CONTENIDO: buscá el bloque "CONFIG" al final
     del archivo, dentro de la etiqueta <script>. Ahí cambiás
     nombres, textos de la carta, preguntas del quiz y el mensaje
     final. No hace falta tocar nada de CSS ni de HTML.
     ============================================================ */
  :root {
    --ink: #1B2430; /* fondo, noche */
    --ink-soft: #26313f;
    --paper: #F3E9D2; /* pergamino */
    --paper-edge: #E2D2A6;
    --gold: #C9A227;
    --rose: #C97B84;
    --text-dark: #2A2420;
    --text-light: #EDE6D8;
    --display: 'Playfair Display', serif;
    --body: 'Cormorant Garamond', serif;
    --hand: 'Caveat', cursive;
  }

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--ink-soft), var(--ink) 60%);
    color: var(--text-light);
    font-family: var(--body);
    overflow-x: hidden;
  }

  [hidden] { display: none !important; }
  
.scene {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 6vh 5vw;
    overflow-y: auto;
    pointer-events: none; /* <--- AGREGAR ESTO */
  }

  /* Centrado inteligente: centra la carta, pero permite scrollear si es muy larga */
  .scene::before, .scene::after {
    content: "";
    margin: auto;
  }

  /* estrellitas ambientales sutiles */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  
  .stars span {
    position: absolute; width: 2px; height: 2px; background: var(--gold);
    border-radius: 50%; opacity: .35; animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle { 
    0%, 100% { opacity: .15; } 
    50% { opacity: .6; } 
  }

  .shooting-star {
    position: fixed; top: 0; left: 0; width: 2px; height: 2px; z-index: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(255,255,255,.8);
    animation: shootAcross 1.3s linear forwards;
  }

  @keyframes shootAcross {
    0% { transform: translate(0,0) rotate(215deg) scaleX(1); opacity: 0; }
    8% { opacity: 1; }
    100% { transform: translate(-60vw, 60vh) rotate(215deg) scaleX(70); opacity: 0; }
  }

  h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; }


  /* resplandor suave tipo luz de luna detrás del sobre */
  .envelope-glow {
    position: absolute; top: 36%; left: 50%; transform: translate(-50%,-50%);
    width: min(120vw, 620px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,39,.22), rgba(201,123,132,.08) 45%, transparent 70%);
    filter: blur(6px);
    opacity: 0;
    /* Aumentamos el delay inicial a 1.5s y el del pulso a 2.9s */
    animation: glowIn 1.4s ease 1.5s forwards, glowPulse 5s ease-in-out 2.9s infinite;
    pointer-events: none; z-index: 0;
  }

  /* chispitas flotando alrededor del sobre */
  .envelope-sparkles { position: absolute; inset: -10%; pointer-events: none; z-index: 2; }
  
  .envelope-sparkles .spark {
    position: absolute; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 6px 1px rgba(201,162,39,.85);
    animation: sparkFloat linear infinite;
  }

  .envelope-sparkles .spark.rose { background: var(--rose); box-shadow: 0 0 6px 1px rgba(201,123,132,.85); }
  
  @keyframes sparkFloat {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    15% { opacity: 1; transform: translateY(-6px) scale(1); }
    85% { opacity: .9; }
    100% { transform: translateY(-90px) scale(.3); opacity: 0; }
  }

  .envelope-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    position: relative;
    opacity: 0; transform: translateY(55px);
    animation: envelopeEntrance 1.2s cubic-bezier(.19,.9,.24,1) 1.5s forwards;
    transition: transform .7s cubic-bezier(.6,.15,.2,1), opacity .6s ease;
    pointer-events: auto; /* <--- AGREGAR ESTO */
    cursor: pointer;      /* <--- AGREGAR ESTO */
  }

  @keyframes glowIn { to { opacity: .6; } }

  @keyframes glowPulse {
    0%, 100% { opacity: .6; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
  }

  @keyframes envelopeEntrance {
    0% { opacity: 0; transform: translateY(55px) scale(.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .envelope {
    width: min(84vw, 360px); aspect-ratio: 3/2;
    position: relative;
    filter: drop-shadow(0 22px 50px rgba(0,0,0,.55));
    perspective: 900px;
    transition: transform .45s cubic-bezier(.34,1.56,.64,1), filter .45s ease;
    /* Mantenemos el movimiento vertical pero quitamos el balanceo */
    animation: envFloat 4.5s ease-in-out infinite;
  }

  @keyframes envFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  #envelopeScene:hover .envelope:not(.open) {
    transform: translateY(-4px) scale(1.03);
    filter: drop-shadow(0 28px 60px rgba(0,0,0,.6));
    animation-play-state: paused;
  }

  .envelope.shake {
    animation: envShake .45s ease;
  }

  @keyframes envShake {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-2deg) scale(1.01); }
    75% { transform: rotate(2deg) scale(1.01); }
  }

  .envelope.open { animation: none; }

  /* cuerpo del sobre, con textura de papel sutil */
  .env-back {
    position: absolute; inset: 0;
    border-radius: 8px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px),
      linear-gradient(155deg, #35485e, #1a2431 75%);
    box-shadow: inset 0 0 0 1px rgba(201,162,39,.4), inset 0 0 24px rgba(0,0,0,.35);
  }

  /* bordecito diplomático tipo "airmail" */
  .env-back::after {
    content: ""; position: absolute; inset: 7px; border-radius: 5px;
    border: 1px dashed rgba(201,162,39,.28);
    pointer-events: none;
  }

  /* solapas laterales e inferior, dan la ilusion de sobre real */
  .env-pocket-left {
    position: absolute; inset: 0; border-radius: 8px 0 0 8px;
    clip-path: polygon(0 0, 46% 50%, 0 100%);
    background: linear-gradient(200deg, #3d5068, #212c39);
  }

  .env-pocket-right {
    position: absolute; inset: 0; border-radius: 0 8px 8px 0;
    clip-path: polygon(100% 0, 54% 50%, 100% 100%);
    background: linear-gradient(340deg, #3d5068, #212c39);
  }

  .env-pocket-bottom {
    position: absolute; inset: 0; border-radius: 0 0 8px 8px;
    clip-path: polygon(4% 100%, 96% 100%, 50% 46%);
    background: linear-gradient(0deg, #2a3644, #1a2431 70%);
  }

  /* solapa superior, la que se abre */
  .env-flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 58%;
    background: linear-gradient(160deg, #445a74, #212c39);
    clip-path: polygon(0 0, 100% 0, 50% 96%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 1.05s cubic-bezier(.61,.06,.32,1.02) .1s, filter .9s ease;
    border-radius: 8px 8px 0 0;
    box-shadow: inset 0 0 0 1px rgba(201,162,39,.25);
    z-index: 3;
  }

  .envelope.open .env-flap {
    transform: rotateX(178deg);
    filter: brightness(.85);
  }

  /* listón de cinta atado alrededor del sobre, se "corta" al abrir, en cascada */
  .env-ribbon-h {
    position: absolute; left: 0; right: 0; top: 50%; height: 13px; transform: translateY(-50%);
    border-radius: 2px;
    background:
      linear-gradient(90deg,
        rgba(50,16,20,.65) 0%, rgba(50,16,20,.2) 5%,
        rgba(255,255,255,.4) 8% 9%, transparent 12%,
        transparent 88%, rgba(255,255,255,.4) 91% 92%,
        rgba(50,16,20,.2) 95%, rgba(50,16,20,.65) 100%),
      linear-gradient(180deg, #e8a3ab 0%, #c26b76 45%, #7d3540 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);
    z-index: 3; transition: transform .55s cubic-bezier(.6,.1,.3,1) .05s, opacity .4s ease .1s;
  }

  .env-ribbon-v {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 13px; transform: translateX(-50%);
    border-radius: 2px;
    background:
      linear-gradient(180deg,
        rgba(50,16,20,.65) 0%, rgba(50,16,20,.2) 5%,
        rgba(255,255,255,.4) 8% 9%, transparent 12%,
        transparent 88%, rgba(255,255,255,.4) 91% 92%,
        rgba(50,16,20,.2) 95%, rgba(50,16,20,.65) 100%),
      linear-gradient(90deg, #e8a3ab 0%, #c26b76 45%, #7d3540 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,.35), inset 1px 0 0 rgba(255,255,255,.3);
    z-index: 3; transition: transform .55s cubic-bezier(.6,.1,.3,1) .16s, opacity .4s ease .2s;
  }

  .envelope.shake .env-ribbon-h, .envelope.open .env-ribbon-h {
    transform: translateY(-50%) translateX(-55%) rotate(-18deg); opacity: 0;
  }

  .envelope.shake .env-ribbon-v, .envelope.open .env-ribbon-v {
    transform: translateX(-50%) translateY(-55%) rotate(18deg); opacity: 0;
  }

  .env-bow {
    position: absolute; left: 50%; top: 50%; width: 70px; height: 42px;
    transform: translate(-50%,-56%); z-index: 4;
    transition: transform .45s cubic-bezier(.5,-0.3,.4,1.4), opacity .35s ease;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.35));
  }

  .envelope.shake .env-bow, .envelope.open .env-bow {
    transform: translate(-50%,-90%) scale(.4) rotate(-35deg); opacity: 0;
  }

  .wax-seal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #e2939c, var(--rose) 55%, #7d3d46 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1;
    color: #fff3f0; letter-spacing: 0;
    box-shadow: 0 5px 14px rgba(0,0,0,.45), inset 0 2px 4px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.3);
    z-index: 5; transition: transform .5s cubic-bezier(.55,-0.4,.3,1.4) .28s, opacity .4s ease .28s;
  }

  .wax-seal span { display: inline-block; transform: translateY(-1.5px); }
  
  .wax-seal::before {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);
  }

  .wax-seal::after {
    content: ""; position: absolute; inset: -16px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,123,132,.55), transparent 70%);
    z-index: -1; animation: sealGlow 2.6s ease-in-out infinite;
  }

 @keyframes sealGlow {
    0%, 100% { opacity: .5; transform: scale(.9); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  /* el sello se resquebraja un poquito antes de saltar, sincronizado con el wiggle */
  .envelope.shake .wax-seal { animation: sealCrack .45s ease; }

  @keyframes sealCrack {
    0%, 100% { transform: translate(-50%,-50%) rotate(0deg) scale(1); }
    35% { transform: translate(-50%,-50%) rotate(-5deg) scale(1.04); }
    65% { transform: translate(-50%,-50%) rotate(4deg) scale(.97); }
  }

  .envelope.open .wax-seal { transform: translate(-50%,-50%) scale(0) rotate(35deg); opacity: 0; }

  .env-label {
    position: absolute; left: 0; right: 0; bottom: 16%; text-align: center;
    font-family: var(--hand); font-size: 1.15rem; color: rgba(237,230,216,.75);
    z-index: 2; letter-spacing: .02em;
  }

  .tap-hint-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .tap-ripple { position: relative; width: 20px; height: 20px; }

  .tap-ripple span {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid var(--gold);
    animation: rippleOut 2.2s ease-out infinite;
  }

  .tap-ripple span:nth-child(2) { animation-delay: .55s; }
  .tap-ripple span:nth-child(3) { animation-delay: 1.1s; }

  .tap-ripple::before {
    content: ""; position: absolute; top: 50%; left: 50%; width: 7px; height: 7px;
    background: var(--gold); border-radius: 50%; transform: translate(-50%,-50%);
    box-shadow: 0 0 6px 1px rgba(201,162,39,.8);
  }

  @keyframes rippleOut {
    0% { transform: scale(.3); opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  .tap-hint {
    font-family: var(--hand); font-size: 1.4rem; color: var(--gold);
    opacity: .85; animation: pulse 2.2s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

  /* ---------- BARRA DE PROGRESO ---------- */
  .progress-bar {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px;
    z-index: 20; opacity: 0; transition: opacity .6s ease;
    pointer-events: none;
  }

  .progress-bar.visible { opacity: 1; }

  .progress-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(237,230,216,.2);
    border: 1px solid rgba(201,162,39,.45);
    transition: background .4s ease, transform .4s ease, box-shadow .4s ease;
  }

  .progress-dot.done { background: var(--gold); }

  .progress-dot.active {
    background: var(--rose); border-color: var(--rose);
    transform: scale(1.4); box-shadow: 0 0 9px rgba(201,123,132,.75);
  }

  .progress-line { width: 18px; height: 1px; background: rgba(201,162,39,.35); }

  /* ---------- BOTÓN DE SONIDO ---------- */
  .mute-btn {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(27,36,48,.55); border: 1px solid rgba(201,162,39,.4);
    color: var(--text-light); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(4px);
    transition: transform .2s ease, background .2s ease, opacity .5s ease;
    opacity: 0;
  }

  .mute-btn.visible { opacity: 1; }

  .mute-btn:hover { transform: scale(1.08); background: rgba(27,36,48,.8); }

  /* --- NUEVO: Falso frente del sobre para superposición 3D --- */
  .fake-envelope-front {
    position: absolute; left: 50%; top: 50%;
    width: min(84vw, 360px); aspect-ratio: 3/2;
    /* Usa las mismas coordenadas que la carta para alinearse perfecto con el sobre real */
    transform: translate(calc(-50% + var(--emerge-x, 0px)), calc(-50% + var(--emerge-y, 0px)));
    z-index: 20; /* Se asegura de estar POR ENCIMA de la carta */
    pointer-events: none; /* Deja pasar los clicks hacia la carta */
    transition: transform .7s cubic-bezier(.6,.15,.2,1), opacity .6s ease;
  }

  /* ---------- HOJAS DE PAPEL (carta / quiz / final) ---------- */
  .paper-scene {
    z-index: 1; width: 100%;
    opacity: 0; transform: translateY(16px) scale(.985);
    filter: blur(2px);
    transition: opacity 1.3s cubic-bezier(.19,.85,.24,1), transform 1.3s cubic-bezier(.19,.85,.24,1), filter 1.1s ease;
  }

  .paper-scene.visible { opacity: 1; transform: none; filter: blur(0); }

  .paper-scene.leaving {
    opacity: 0; transform: translateY(-16px) scale(.97); filter: blur(3px);
    transition: opacity .45s ease, transform .45s ease, filter .45s ease;
  }

  .paper-scene[hidden] { display: none; }

  /* la carta emerge del sobre con un movimiento de salida en dos tiempos:
     arranca exactamente en la posición del sobre en pantalla (--emerge-x/-y,
     calculadas por JS) y solo se ve a través del triángulo que deja la
     solapa abierta (mismo recorte que .env-flap); a medida que sube y crece
     ese triángulo se agranda hasta mostrar la hoja completa en su lugar final —
     inspirado en la animación de la carta de referencia */

  /* 1. Quitamos el blur de la escena y preparamos el contenedor */
  .paper-scene.letter-emerge {
    opacity: 0; z-index: 10;
    filter: blur(0) !important; /* FUNDAMENTAL: Mantiene la carta nítida */
    transition: opacity 0.6s ease;
    transform: none; /* Quitamos la escala al contenedor gigante */
  }

  /* 2. Evitamos que la carta colapse cuando está vacía y ajustamos el padding */
  .paper-letter { 
    padding-top: 30px; 
    padding-bottom: 140px !important; /* la hoja de la carta tiene el título un poco más arriba */
    min-height: 480px; 
    width: 100%;
  }

  #continueBtn { display: none; } /* Ocultamos el botón hasta que termine de tipear */

  /* 3. Animación y recorte directos AL PAPEL */
  .paper-scene.letter-emerge .paper {
    transform: translate(var(--emerge-x,0px), calc(var(--emerge-y,0px) + 80px)) scale(0.58);
    clip-path: polygon(0 0, 100% 0, 100% 0%, 50% 44%, 0 0%);
    transition: transform 0.8s cubic-bezier(.25, 1, .35, 1) 0.6s,
                clip-path 0.8s cubic-bezier(.25, 1, .35, 1) 0.6s;
  }

  /* Estado donde la carta asoma y espera el click (Ahora sin animación) */
  .paper-scene.letter-emerge.peeking { opacity: 1; }

  .paper-scene.letter-emerge.peeking .paper {
    /* Mantenemos las coordenadas de espera, pero sin transición */
    transform: translate(var(--emerge-x,0px), calc(var(--emerge-y,0px) + 25px)) scale(0.58);
    /* Mantenemos el recorte exacto para que calce en el sobre */
    clip-path: polygon(0 0, 100% 0, 100% 14%, 50% 50%, 0 14%);
    filter: brightness(0.85); 
    cursor: pointer;
    /* ELIMINAMOS EL TRANSITION: Al quitarlo, la carta aparece quieta y al instante */
    transition: none; 
  }

  /* Animación final cuando se hace click (sale volando al centro) */
  .paper-scene.letter-emerge.visible { 
    opacity: 1; 
    /* NUEVO: Salta instantáneamente por encima de todo el sobre */
    z-index: 30; 
  }

  .paper-scene.letter-emerge.visible .paper {
    animation: letterEmergeOut 1.4s cubic-bezier(.25, 1, .35, 1) forwards;
    cursor: default;
  }

  @keyframes letterEmergeOut {
    0% {
      transform: translate(var(--emerge-x,0px), calc(var(--emerge-y,0px) + 25px)) scale(0.58);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 0 100%);
      filter: brightness(0.85); 
    }
    45% {
      transform: translate(var(--emerge-x,0px), calc(var(--emerge-y,0px) - 260px)) scale(0.58);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 0 100%); 
      filter: brightness(1); 
    }
    99% {
      transform: translate(0,0) scale(1) rotate(0deg);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 0 100%);
      filter: brightness(1);
    }
    100% {
      transform: translate(0,0) scale(1) rotate(0deg);
      /* ESTA ES LA SOLUCIÓN: Libera los márgenes visuales hacia abajo */
      clip-path: polygon(-20% -20%, 120% -20%, 120% 200%, -20% 200%);
      filter: brightness(1);
    }
  }

  .paper p, .paper h2 {
    opacity: 0; transform: translateY(10px);
    animation: paperFadeIn .6s ease forwards;
  }

  .paper h2 { animation-delay: .05s; }
  .paper p:nth-of-type(1) { animation-delay: .18s; }
  .paper p:nth-of-type(2) { animation-delay: .30s; }
  .paper p:nth-of-type(3) { animation-delay: .42s; }
  .paper p:nth-of-type(4) { animation-delay: .54s; }

  @keyframes paperFadeIn { to { opacity: 1; transform: none; } }

  /* párrafos de la carta: se revelan con máquina de escribir vía JS, no con el fade genérico */
  .paper p.letter-p { opacity: 1 !important; transform: none !important; animation: none !important; }

  .typing-cursor {
    display: inline-block; width: 2px; height: 1em; background: var(--text-dark);
    margin-left: 2px; vertical-align: text-bottom; animation: blinkCursor .8s steps(1) infinite;
  }

  @keyframes blinkCursor { 50% { opacity: 0; } }

  .paper {
    max-width: 580px; /* Volvemos al ancho original para que encaje en el sobre */
    width: 100%; 
    margin: 0 auto;
    flex-shrink: 0; /* <--- AGREGÁ ESTA LÍNEA ACÁ */
    pointer-events: auto; /* <--- AGREGAR ESTA LÍNEA ACÁ */
    background:
      /* pliegues horizontales, como si estuviera doblada en tres */
      linear-gradient(to bottom, transparent 32.6%, rgba(255,255,255,.25) 32.6% 32.9%, transparent 32.9%),
      linear-gradient(to bottom, transparent 32%, rgba(70,54,38,.12) 32% 32.35%, transparent 32.35%),
      linear-gradient(to bottom, transparent 65.6%, rgba(255,255,255,.25) 65.6% 65.9%, transparent 65.9%),
      linear-gradient(to bottom, transparent 65%, rgba(70,54,38,.12) 65% 65.35%, transparent 65.35%),
      /* leve viñeta cálida en los bordes, sutil en vez de manchas quemadas */
      radial-gradient(ellipse 100% 45% at 50% 0%, rgba(120,90,45,.07), transparent 70%),
      radial-gradient(ellipse 100% 45% at 50% 100%, rgba(120,90,45,.07), transparent 70%),
      radial-gradient(ellipse 60% 100% at 0% 50%, rgba(120,90,45,.05), transparent 65%),
      radial-gradient(ellipse 60% 100% at 100% 50%, rgba(120,90,45,.05), transparent 65%),
      var(--paper);
    color: var(--text-dark);
    border-radius: 2px;
    padding: 50px 42px 44px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
    position: relative;
  }

  /* marco doble, fino y dorado — más prolijo que las esquinas quemadas de antes */
  .paper::before {
    content: ""; position: absolute; inset: 11px;
    border: 1px solid rgba(201,162,39,.4);
    pointer-events: none;
  }

  .paper::after {
    content: ""; position: absolute; inset: 15px;
    border: 1px solid rgba(201,162,39,.18);
    pointer-events: none;
  }

  /* pequeño adorno floral en las esquinas del marco */
  .paper-corner {
    position: absolute; width: 15px; height: 15px; pointer-events: none; z-index: 1;
    border: 1px solid rgba(201,162,39,.55);
  }

  .paper-corner.tl{ top:11px; left:11px; border-width:1px 0 0 1px; }
  .paper-corner.tr{ top:11px; right:11px; border-width:1px 1px 0 0; }
  .paper-corner.bl{ bottom:11px; left:11px; border-width:0 0 1px 1px; }
  .paper-corner.br{ bottom:11px; right:11px; border-width:0 1px 1px 0; }

  .paper h2{
    font-size: 1.6rem; margin:0 0 6px; color: var(--text-dark); text-align:center;
  }

  .paper h2::after{
    content:""; display:block; width:70px; height:1px; margin:14px auto 22px;
    background: linear-gradient(90deg, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
  }

  .paper h2::before{
    content:"✦"; display:block; text-align:center; font-size:.7rem;
    color: var(--gold); margin-bottom:2px; letter-spacing:.3em;
  }

  .paper p{ font-size: 1.28rem; line-height:1.55; margin: 0 0 16px; font-style: italic; }
  .paper p:last-of-type{ margin-bottom: 26px; }

  .btn{
    font-family: var(--display); font-size: .95rem; letter-spacing:.04em;
    background: var(--ink); color: var(--text-light);
    border: 1px solid var(--gold); border-radius: 2px;
    padding: 13px 26px; cursor:pointer;
    transition: background .25s ease, transform .2s ease;
  }

  .btn:hover{ background:#2c3a4c; transform: translateY(-2px); }

  /* ---------- QUIZ ---------- */
  .q-progress{ font-family: var(--hand); font-size:1.15rem; color:#7a5c1f; margin-bottom:6px; }
  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom: 18px; }

  .option-btn{
    text-align:left; font-family: var(--body); font-style:italic; font-size:1.15rem;
    background: rgba(42,36,32,.04); border:1px solid rgba(42,36,32,.18);
    border-radius:4px; padding:12px 16px; cursor:pointer; color: var(--text-dark);
    transition: background .25s ease, border-color .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
    opacity:0; animation: optFadeIn .5s ease forwards;
  }

  .option-btn:nth-child(1){ animation-delay:.1s; }
  .option-btn:nth-child(2){ animation-delay:.2s; }
  .option-btn:nth-child(3){ animation-delay:.3s; }
  .option-btn:nth-child(4){ animation-delay:.4s; }

  @keyframes optFadeIn{ from{ opacity:0; transform: translateX(-8px);} to{ opacity:1; transform:none; } }

  .option-btn:hover:not(:disabled){ background: rgba(201,123,132,.12); transform: translateX(3px); }
  .option-btn.correct{ background: rgba(120,150,90,.25); border-color:#6f8a4e; transform: scale(1.02); }
  .option-btn.wrong{ background: rgba(200,90,90,.18); border-color:#a85050; animation: optShake .4s ease; }

  @keyframes optShake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-5px); }
    75%{ transform: translateX(5px); }
  }

  .feedback{
    font-family: var(--hand); font-size:1.25rem; color: var(--rose); min-height: 1.6em; margin-bottom: 10px;
    opacity:0; transform: translateY(6px);
    transition: opacity .4s ease, transform .4s ease;
  }

  .feedback.show{ opacity:1; transform:none; }

  /* ---------- FINAL ---------- */

  .signature{ font-family: var(--hand); font-size: 2rem; color: var(--rose); text-align:right; margin-top: 6px; }

  .score-stamp{
    display:flex; align-items:center; gap:18px;
    margin: 8px 0 22px;
    padding: 16px 20px;
    border: 1px dashed rgba(42,36,32,.28);
    border-radius: 6px;
    background: rgba(201,162,39,.06);
    opacity:0; transform: translateY(10px) scale(.9);
    animation: scoreStampIn .55s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: .3s;
    transition: background .4s ease, border-color .4s ease;
  }

  @keyframes scoreStampIn{ to{ opacity:1; transform:none; } }

  .score-stamp .score-circle{
    flex: 0 0 auto;
    width:72px; height:72px; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, #e2939c, var(--rose) 55%, #7d3d46 100%);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--display); font-weight:700; font-size:1.2rem; color:#fff3f0;
    box-shadow: 0 5px 14px rgba(0,0,0,.3), inset 0 2px 4px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.3);
    transition: background .4s ease;
  }

  .score-stamp .score-text{
    font-family: var(--body); font-style: italic; font-size: 1.15rem; line-height:1.4; color: var(--text-dark);
  }

  .score-stamp .score-text strong{ font-style:normal; font-family: var(--display); color:#7d3d46; }

  .score-stamp.low{
    border-color: rgba(168,80,80,.45);
    background: rgba(168,80,80,.08);
    animation: scoreStampIn .55s cubic-bezier(.34,1.56,.64,1) forwards, scoreWobble .5s ease .9s;
  }

  .score-stamp.low .score-circle{
    background: radial-gradient(circle at 32% 28%, #d99a9a, #a85050 55%, #5c2626 100%);
  }

  @keyframes scoreWobble{
    0%,100%{ transform: rotate(0); }
    25%{ transform: rotate(-1.5deg); }
    75%{ transform: rotate(1.5deg); }
  }

  #scoreExtraText p{
    opacity:0; transform: translateY(10px);
    animation: paperFadeIn .6s ease forwards;
    animation-delay: .55s;
  }

  /* ---------- RESPUESTA OPCIONAL ---------- */
  @keyframes paperFadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: none; }
  }

  .show-reply-paper {
    display: block !important;
    animation: paperFadeInUp 0.8s ease forwards;
  }

  .reply-hint {
    font-family: var(--body);
    font-size: 1.2rem;
    font-style: italic;
    color: var(--text-dark);
    line-height: 1.4;
  }

  .reply-area {
    box-sizing: border-box;
    width: 100%;
    min-height: 90px;
    padding: 12px;
    font-family: var(--hand);
    font-size: 1.3rem;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(201,162,39,.5);
    border-radius: 4px;
    resize: vertical;
    outline: none;
    margin-bottom: 20px;
    transition: background 0.3s, border-color 0.3s;
  }

  .reply-area:focus {
    background: rgba(255, 255, 255, 0.6);
    border-color: var(--rose);
  }

  /* ---------- EMOJIS ---------- */
  .emoji-btn {
    position: absolute;
    bottom: 25px; /* Lo ubica abajo a la derecha de la caja de texto */
    right: 10px;
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s, transform 0.2s;
  }

  .emoji-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .emoji-picker {
    position: absolute;
    bottom: 65px;
    right: 0;
    background: var(--paper);
    border: 1px solid rgba(201,162,39,.5);
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    z-index: 100;
  }

  .emoji-item {
    font-size: 1.3rem;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s;
    user-select: none;
  }

  .emoji-item:hover {
    transform: scale(1.3);
  }

  /* petalos cayendo, sutil, solo en la escena final */
  .petals{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }

  .petal{
    position:absolute; top:-5%; font-size: 14px; color: var(--rose); opacity:.7;
    animation: fall linear infinite;
  }

  @keyframes fall{ to{ transform: translateY(110vh) rotate(360deg); } }

  /* ---------- FOTOS ---------- */
  .paper.wide{ max-width: 680px; }

  .photo-gallery{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 4px;
    margin: 10px 0 22px;
  }

  .polaroid{
    background:#fdfaf3; padding:10px 10px 32px; width: 150px;
    box-shadow: 0 10px 22px rgba(0,0,0,.35);
    opacity:0; transform: translateY(14px) scale(.92) rotate(0deg);
    animation: polaroidIn .55s cubic-bezier(.34,1.4,.4,1) forwards;
    transition: transform .3s ease, box-shadow .3s ease;
    position:relative;
  }

  .polaroid:hover{ transform: translateY(-4px) scale(1.04) rotate(0deg) !important; box-shadow: 0 16px 30px rgba(0,0,0,.45); z-index:2; }
  .polaroid:nth-child(6n+1){ --rot:-4deg; }
  .polaroid:nth-child(6n+2){ --rot:3deg; }
  .polaroid:nth-child(6n+3){ --rot:-2deg; }
  .polaroid:nth-child(6n+4){ --rot:5deg; }
  .polaroid:nth-child(6n+5){ --rot:-3deg; }
  .polaroid:nth-child(6n+6){ --rot:2deg; }

  @keyframes polaroidIn{ to{ opacity:1; transform: translateY(0) scale(1) rotate(var(--rot,0deg)); } }

  .polaroid img{ width:100%; height:150px; object-fit:cover; display:block; background:#ddd; }

  .polaroid .caption{
    position:absolute; bottom:6px; left:0; right:0; text-align:center;
    font-family: var(--hand); font-size:.95rem; color:#333;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

/* ---------- FOTOS DE FONDO ---------- */
  .bg-photos-container {
    position: fixed;
    inset: 0;
    z-index: 1; /* Detrás del sobre y de la carta */
    pointer-events: none; /* Para que no bloqueen los clics al sobre */
    overflow: hidden;
  }

.bg-polaroid {
    position: absolute;
    background: #fdfaf3;
    padding: 8px 8px 30px 8px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    width: clamp(100px, 15vw, 160px);
    opacity: 0.35;
    filter: sepia(0.3) brightness(0.8);
    pointer-events: auto; /* <--- IMPORTANTE: Permite hacerles clic */
    cursor: zoom-in; /* <--- Cambia el cursor a una lupa */
    transition: filter 0.3s ease, z-index 0s; /* Para el efecto al pasar el mouse */
  }

/* Efecto para que se iluminen y vengan al frente al pasar el mouse */
  .bg-polaroid:hover {
    filter: sepia(0) brightness(1.1);
    transform: scale(1.08) rotate(0deg) !important; /* <--- Efecto de enderezarse */
    z-index: 10;
  }
  .bg-polaroid img {
    width: 100%;
    aspect-ratio: 1 / 1; /* Hace que la foto sea cuadrada */
    object-fit: cover;
    display: block;
    background: #ddd;
  }

  /* Lado Izquierdo */
  .bg-polaroid.p1 { top: 8%; left: 8%; transform: rotate(-8deg); }
  .bg-polaroid.p2 { top: 35%; left: 4%; transform: rotate(12deg); }
  .bg-polaroid.p3 { top: 55%; left: 18%; transform: rotate(-5deg); } /* <-- Movida más arriba y a la derecha */
  .bg-polaroid.p4 { bottom: 6%; left: 8%; transform: rotate(4deg); }

  /* Lado Derecho */
  .bg-polaroid.p5 { top: 10%; right: 9%; transform: rotate(10deg); }
  .bg-polaroid.p6 { top: 38%; right: 5%; transform: rotate(-14deg); }
  .bg-polaroid.p7 { top: 58%; right: 18%; transform: rotate(7deg); } /* <-- Movida más arriba y a la izquierda */
  .bg-polaroid.p8 { bottom: 8%; right: 8%; transform: rotate(-4deg); }

  /* Centro-Arriba y Centro-Abajo */
  .bg-polaroid.p9 { top: 4%; left: 30%; transform: rotate(-4deg); }
  .bg-polaroid.p10 { top: 6%; right: 28%; transform: rotate(6deg); }
  .bg-polaroid.p11 { bottom: 5%; left: 30%; transform: rotate(15deg); }
  .bg-polaroid.p12 { bottom: 4%; right: 28%; transform: rotate(-9deg); }

</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- FOTOS DE FONDO -->
<div class="bg-photos-container">
  <div class="bg-polaroid p1"><img src="https://picsum.photos/400/400?random=1" alt="Foto 1"></div>
  <div class="bg-polaroid p2"><img src="https://picsum.photos/400/400?random=2" alt="Foto 2"></div>
  <div class="bg-polaroid p3"><img src="https://picsum.photos/400/400?random=3" alt="Foto 3"></div>
  <div class="bg-polaroid p4"><img src="https://picsum.photos/400/400?random=4" alt="Foto 4"></div>
  <div class="bg-polaroid p5"><img src="https://picsum.photos/400/400?random=5" alt="Foto 5"></div>
  <div class="bg-polaroid p6"><img src="https://picsum.photos/400/400?random=6" alt="Foto 6"></div>
  <div class="bg-polaroid p7"><img src="https://picsum.photos/400/400?random=7" alt="Foto 7"></div>
  <div class="bg-polaroid p8"><img src="https://picsum.photos/400/400?random=8" alt="Foto 8"></div>
  <div class="bg-polaroid p9"><img src="https://picsum.photos/400/400?random=9" alt="Foto 9"></div>
  <div class="bg-polaroid p10"><img src="https://picsum.photos/400/400?random=10" alt="Foto 10"></div>
  <div class="bg-polaroid p11"><img src="https://picsum.photos/400/400?random=11" alt="Foto 11"></div>
  <div class="bg-polaroid p12"><img src="https://picsum.photos/400/400?random=12" alt="Foto 12"></div>
</div>

<div class="progress-bar" id="progressBar"></div>

<button class="mute-btn" id="muteBtn" aria-label="Silenciar música" title="Silenciar música">🔊</button>

<!-- SOBRE -->
<div class="scene" id="envelopeScene">
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope-glow"></div>
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-pocket-left"></div>
      <div class="env-pocket-right"></div>
      <div class="env-pocket-bottom"></div>
      <div class="env-flap"></div>
      <div class="env-label" id="envLabel"></div>
      <div class="env-ribbon-h"></div>
      <div class="env-ribbon-v"></div>
      <svg class="env-bow" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bowGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e29aa3"/>
            <stop offset="100%" stop-color="#8a3d48"/>
          </linearGradient>
        </defs>
        <path d="M50,30 C30,8 8,4 3,20 C-2,36 22,42 38,33 C43,30 47,29 50,30 Z" fill="url(#bowGrad)"/>
        <path d="M50,30 C70,8 92,4 97,20 C102,36 78,42 62,33 C57,30 53,29 50,30 Z" fill="url(#bowGrad)"/>
        <circle cx="50" cy="30" r="9" fill="#7d3d48"/>
      </svg>
      <div class="wax-seal" id="waxSeal">?</div>
      <div class="envelope-sparkles" id="envelopeSparkles"></div>
    </div>
    <div class="tap-hint-wrap">
      <div class="tap-ripple"><span></span><span></span><span></span></div>
      <p class="tap-hint">Tocá el sobre para abrirlo</p>
    </div>
  </div>
</div>

<!-- CARTA -->
<div class="scene paper-scene letter-emerge" id="letterScene" hidden>
  <div class="paper paper-letter">
    <div class="paper-shadow"></div>
    <span class="paper-corner tl"></span><span class="paper-corner tr"></span><span class="paper-corner bl"></span><span class="paper-corner br"></span>
    <h2 id="letterTitle"></h2>
    <div id="letterText"></div>
    <button class="btn" id="continueBtn">Continuar →</button>
  </div>
  
  <!-- NUEVO: Falso frente para superponer a la carta y crear profundidad real -->
  <div class="fake-envelope-front" id="fakeEnvelopeFront">
    <div class="env-pocket-left"></div>
    <div class="env-pocket-right"></div>
    <div class="env-pocket-bottom"></div>
    <div class="env-label" id="fakeEnvLabel"></div>
  </div>
</div>

<!-- QUIZ -->
<div class="scene paper-scene" id="quizScene" hidden>
  <div class="paper">
    <span class="paper-corner tl"></span><span class="paper-corner tr"></span><span class="paper-corner bl"></span><span class="paper-corner br"></span>
    <h2 id="quizTitle"></h2>
    <p id="quizIntro" style="font-style:italic; margin-bottom:20px;"></p>
    <div class="q-progress" id="qProgress"></div>
    <p id="quizQuestion" style="font-style:normal; font-weight:600;"></p>
    <div class="options" id="quizOptions"></div>
    <div class="feedback" id="quizFeedback"></div>
    <button class="btn" id="quizNextBtn" style="display:none;">Siguiente →</button>
  </div>
</div>

<!-- RESULTADO / PUNTAJE -->
<div class="scene paper-scene" id="scoreScene" hidden>
  <div class="paper">
    <span class="paper-corner tl"></span><span class="paper-corner tr"></span><span class="paper-corner bl"></span><span class="paper-corner br"></span>
    <h2 id="scoreTitle"></h2>
    <div class="score-stamp" id="scoreStamp">
      <div class="score-circle" id="scoreCircle"></div>
      <div class="score-text" id="scoreText"></div>
    </div>
    <div id="scoreExtraText"></div>
    <button class="btn" id="scoreContinueBtn">Continuar →</button>
  </div>
</div>

<!-- VISOR DE FOTOS -->
<div id="photoModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; flex-direction:column; align-items:center; justify-content:center; padding:5vw; opacity:0; transition:opacity 0.3s ease; backdrop-filter:blur(3px);">
  <button id="closeModalBtn" style="position:absolute; top:15px; right:20px; background:none; border:none; color:#fff; font-size:3.5rem; cursor:pointer; padding:10px; z-index:1000; line-height:1;">&times;</button>
  <!-- Polaroid Gigante -->
  <div id="modalPolaroid" style="background:#fdfaf3; padding:15px 15px 65px; box-shadow:0 15px 50px rgba(0,0,0,0.7); position:relative; max-width:90vw; transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);">
    <img id="modalImg" src="" style="max-width:100%; max-height:70vh; display:block; object-fit:contain; background:#ddd;" />
    <div id="modalCaption" style="position:absolute; bottom:18px; left:10px; right:10px; text-align:center; font-family:var(--hand); font-size:1.8rem; color:#333; line-height:1.1;"></div>
  </div>
</div>

<!-- FOTOS -->
<div class="scene paper-scene" id="photosScene" hidden>
  <div class="paper wide">
    <span class="paper-corner tl"></span><span class="paper-corner tr"></span><span class="paper-corner bl"></span><span class="paper-corner br"></span>
    <h2 id="photosTitle"></h2>
    <p id="photosIntro" style="font-style:normal;"></p>
    <div class="photo-gallery" id="photoGallery"></div>
    <button class="btn" id="photosContinueBtn">Seguir →</button>
  </div>
</div>

<!-- FINAL -->
<div class="scene paper-scene" id="finalScene" hidden>
  <div class="petals" id="petals"></div>
  <!-- Carta principal del final -->
  <div class="paper" id="mainFinalPaper">
    <span class="paper-corner tl"></span><span class="paper-corner tr"></span><span class="paper-corner bl"></span><span class="paper-corner br"></span>
    <h2 id="finalTitle"></h2>
    <div id="finalText"></div>
    <div class="signature" id="finalSignature"></div>
    <!-- NUEVO: Botón para revelar la segunda carta -->
    <button class="btn" id="finalContinueBtn" style="display:none; margin-top: 25px; width: 100%;">Tengo algo más que decirte →</button>
  </div>

  <!-- Segunda carta (Opcional) -->
  <div class="paper" id="replyPaper" style="display: none; margin-top: 30px; padding: 30px 42px; text-align: center;">
    <span class="paper-corner tl"></span><span class="paper-corner tr"></span><span class="paper-corner bl"></span><span class="paper-corner br"></span>
    <h2 style="font-size: 1.4rem;">Opcional</h2>
    <!-- Contenedor vacío donde la máquina escribirá el texto -->
    <div id="replyTextContainer" class="reply-hint" style="margin-top: 10px; margin-bottom: 25px; min-height: 60px;"></div>
    <!-- Botones de Si / No (Ocultos hasta que termine de escribir) -->
    <div id="replyPrompt" style="display: none; gap: 15px; justify-content: center; flex-wrap: wrap;">
      <button class="btn" id="btnYes">Sí, escribir ahora</button>
      <button class="btn" id="btnNo" style="background: transparent; color: var(--ink); border-color: var(--ink);">Mejor en persona</button>

    <!-- Caja de texto oculta -->
    <div id="replyForm" style="display: none; flex-direction: column; align-items: center; width: 100%;">
      <div style="position: relative; width: 100%;">
        <textarea class="reply-area" id="replyText" placeholder="Escribí tu mensaje acá..."></textarea>
        <!-- Botón para abrir emojis -->
        <button type="button" class="emoji-btn" id="emojiToggleBtn">😀</button>
        <!-- Panel de emojis -->
        <div class="emoji-picker" id="emojiPicker" style="display: none;"></div>
      </div>
      <button class="btn" id="replyBtn">Enviar mensaje ✨</button>
    </div>
  </div>
</div>
<script>

/* ============================================================
   CONFIG — editá acá todo el contenido. No toques el resto del
   archivo salvo que quieras cambiar el diseño.
   ============================================================ */

const CONFIG = {
  // Texto dentro del sello de cera — poné la inicial de su nombre (ej: "M"),
  // o dejá el corazón si no querés cambiar nada
  sealInitial: "K",

  // Sonido de tecleo mientras se escribe la carta. Se puede silenciar con el botón 🔊.
  soundEnabled: true,

  // Texto escrito a mano en el frente del sobre
  envelopeLabel: "Para vos ♡",

  // ---- CARTA (primera hoja que se lee) ----
  letterTitle: "Para Karen",
  letterParagraphs: [
    "Si estas leyendo esto quiere decir que pudiste resolverlo. La verdad, esperaba que lo lograras... aunque también espero que no haya sido solo por casualidad...",

  };

  function getCtx(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function b64ToArrayBuffer(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function decodeAll(){
    const c = getCtx();
    Object.keys(SAMPLES_B64).forEach(key => {
      if(buffers[key]) return;
      c.decodeAudioData(b64ToArrayBuffer(SAMPLES_B64[key]), buf => { buffers[key] = buf; });
    });
  }

  function playBuffer(key, { gain = 0.8, rateJitter = 0.06, pan = 0 } = {}){
    if(muted) return;
    const buf = buffers[key];
    if(!buf) return; // todavía decodificando, se salta este golpe sin drama
    const c = getCtx();
    const src = c.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 1 + (Math.random() * 2 - 1) * rateJitter;
    const g = c.createGain();
    g.gain.value = gain;
    let node = src.connect(g);

    if(c.createStereoPanner){
      const panner = c.createStereoPanner();
      panner.pan.value = pan;
      g.connect(panner).connect(c.destination);
    } else {
      g.connect(c.destination);

    }

    src.start();
  }

  const CLACKS = ['clack1', 'clack2', 'clack3', 'clack4', 'clack5'];

  function playTick(){
    const key = CLACKS[Math.floor(Math.random() * CLACKS.length)];
    const pan = (Math.random() * 2 - 1) * 0.3;
    playBuffer(key, { gain: 0.15 + Math.random() * 0.04, rateJitter: 0.07, pan });
  }

  function playSpaceBar(){
    playBuffer('space', { gain: 0.14, rateJitter: 0.04, pan: 0 });
  }

  function playReturn(){
    playBuffer('returnbell', { gain: 0.14, rateJitter: 0.02, pan: 0 });
  }

  function toggleMute(){
    muted = !muted;
    return muted;
  }

  decodeAll();

  return { playTick, playSpaceBar, playReturn, toggleMute, get muted(){ return muted; } };
})();

// alinea el punto de partida de la animación de la carta con la posición
// real del sobre en pantalla, para que "salga" justo de ahí
function alignLetterToEnvelope(){
  const rect = envelope.getBoundingClientRect();
  const envCenterX = rect.left + rect.width / 2;
  const envCenterY = rect.top + rect.height / 2;
  letterScene.style.setProperty('--emerge-x', (envCenterX - window.innerWidth / 2) + 'px');
  letterScene.style.setProperty('--emerge-y', (envCenterY - window.innerHeight / 2) + 'px');
}

// pequeña explosión de corazones y chispas justo cuando se rompe el sello
function burstFromSeal(){
  const rect = envelope.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  const symbols = ['♡', '✦', '❀'];
  const colors = ['#c97b84', '#c9a227', '#e2939c'];
  
  for(let i = 0; i < 16; i++){
    const el = document.createElement('div');
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.position = 'fixed';
    el.style.left = originX + 'px';
    el.style.top = originY + 'px';
    el.style.fontSize = (13 + Math.random() * 11) + 'px';
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    el.style.pointerEvents = 'none';
    el.style.zIndex = '30';
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%,-50%) scale(.4)';
    el.style.transition = 'transform 1s cubic-bezier(.16,.85,.24,1), opacity 1s ease .1s';
    el.style.textShadow = '0 2px 5px rgba(0,0,0,.35)';
    document.body.appendChild(el);
    
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 150;
    const x = Math.cos(angle) * dist;
    const y = Math.sin(angle) * dist - 35;
    
    requestAnimationFrame(() => {
      el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1) rotate(${Math.random() * 70 - 35}deg)`;
      requestAnimationFrame(() => { el.style.opacity = '0'; });
    });
    setTimeout(() => el.remove(), 1150);
  }
}

// ---- barra de progreso ----
const progressBar = document.getElementById('progressBar');
let progressSteps = [];

function buildProgress(){
  progressSteps = ['carta', 'quiz', 'resultado'];
  if(CONFIG.photos && CONFIG.photos.items && CONFIG.photos.items.length > 0){
    progressSteps.push('fotos');
  }
  progressSteps.push('final');
  progressBar.innerHTML = '';
  
  progressSteps.forEach((step, i) => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.dataset.step = step;
    progressBar.appendChild(dot);
    
    if(i < progressSteps.length - 1){
      const line = document.createElement('div');
      line.className = 'progress-line';
      progressBar.appendChild(line);
    }
  });
}

function updateProgress(step){
  progressBar.classList.add('visible');
  const idx = progressSteps.indexOf(step);
  const dots = progressBar.querySelectorAll('.progress-dot');
  dots.forEach((d, i) => {
    d.classList.remove('active', 'done');
    if(i < idx) d.classList.add('done');
    else if(i === idx) d.classList.add('active');
  });
}

let skipTyping = false;

function showLetter(){
  document.getElementById('letterTitle').textContent = CONFIG.letterTitle;
  const box = document.getElementById('letterText');
  box.innerHTML = '';
  document.getElementById('continueBtn').style.display = 'none';
  skipTyping = false;
  letterScene.hidden = false;
  requestAnimationFrame(() => letterScene.classList.add('visible'));
  updateProgress('carta');
  
  // Esperamos a que termine la animación de salida (1.4s)
  setTimeout(() => {
    // ESTA ES LA MAGIA: Liberamos la carta del bug del navegador ANTES de que empiece a escribir
    letterScene.classList.remove('letter-emerge'); 
    letterScene.style.zIndex = '30'; // Aseguramos que se mantenga arriba del sobre
    
    // Ahora sí, empieza a escribir
    typeParagraphs(box, CONFIG.letterParagraphs, 0);
  }, 1400);
}

function typeParagraphs(container, paragraphs, idx){
  if(idx >= paragraphs.length){
    // Muestra los botones cuando termina de escribir
    if (container.id === 'letterText') {
      const btn = document.getElementById('continueBtn');
      if(btn) {
        btn.style.display = 'block';
        btn.style.margin = '20px auto 30px'; 
        // ESTA ES LA SOLUCIÓN:
        // Quitamos la clase de animación para que el navegador libere la 
        // hoja y permita que el papel crezca hasta abajo cubriendo el botón.
        const escena = container.closest('.paper-scene');
        if (escena) {
          escena.classList.remove('letter-emerge');
        }
        setTimeout(() => container.closest('.scene').scrollTo({ top: container.closest('.scene').scrollHeight, behavior: 'smooth' }), 100);
      }
    }
    if (container.id === 'finalText') {
      const btn = document.getElementById('finalContinueBtn');
      if(btn) {
        btn.style.display = 'block';
        btn.style.margin = '30px auto 40px';
        setTimeout(() => container.closest('.scene').scrollTo({ top: container.closest('.scene').scrollHeight, behavior: 'smooth' }), 100);
      }
    }
    if (container.id === 'replyTextContainer') {
      const prompt = document.getElementById('replyPrompt');
      if(prompt) {
        prompt.style.display = 'flex';
        prompt.style.marginTop = '20px';
        setTimeout(() => container.closest('.scene').scrollTo({ top: container.closest('.scene').scrollHeight, behavior: 'smooth' }), 100);
      }
    }
    return;
  }
  
  const p = document.createElement('p');
  p.className = 'letter-p';
  const cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  p.appendChild(cursor);
  container.appendChild(p);
  
  const text = Array.from(paragraphs[idx]);
  let i = 0;

  function step(){
    if(skipTyping){
      cursor.before(document.createTextNode(text.slice(i).join('')));
      i = text.length;
    } else {
      const ch = text[i];
      cursor.before(document.createTextNode(ch));
      
      if(ch === ' ') AudioFX.playSpaceBar();
      else if(ch.trim() !== '') AudioFX.playTick();
      
      i++;
    }
    
    // ACÁ ESTÁ LA MAGIA: Empuja la pantalla hacia abajo a medida que escribe
    const escenaPadre = container.closest('.scene');
    if(escenaPadre) {
      escenaPadre.scrollTop = escenaPadre.scrollHeight;
    }
    
    if(i < text.length){
      setTimeout(step, skipTyping ? 0 : 35 + Math.random() * 20);
    } else {
      cursor.remove();
      if(!skipTyping) AudioFX.playReturn();
      setTimeout(() => typeParagraphs(container, paragraphs, idx + 1), skipTyping ? 0 : 400);
    }
  }
  step();
}

// Click en la carta: la saca del sobre o salta el tipeo si ya salió
letterScene.addEventListener('click', () => { 
  if(letterScene.classList.contains('peeking')) {
    // 1. Inicia la animación de salida
    letterScene.classList.remove('peeking');
    showLetter();
    
    // 2. Escondemos el texto de ayuda
    const hintWrap = document.querySelector('.tap-hint-wrap');
    if(hintWrap) {
      hintWrap.style.transition = 'opacity 0.3s ease';
      hintWrap.style.opacity = '0';
    }
    // 3. Ocultamos el sobre real y el falso frente al mismo tiempo (SIN DEMORA)
    setTimeout(() => {
      envelopeWrap.style.opacity = '0';
      envelopeWrap.style.transform = 'translateY(-24px) scale(.96)';
      const fakeFront = document.getElementById('fakeEnvelopeFront');
      if(fakeFront) {
        fakeFront.style.opacity = '0';
        /* Se mueve exactamente igual que el sobre real (-24px) para sincronizarse */
        fakeFront.style.transform = 'translate(calc(-50% + var(--emerge-x, 0px)), calc(-50% + var(--emerge-y, 0px) - 24px)) scale(.96)';
      }
      setTimeout(() => {
        envelopeScene.hidden = true;
      }, 750);

document.getElementById('continueBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  letterScene.classList.remove('visible');
  letterScene.classList.add('leaving');
  setTimeout(() => {
    letterScene.hidden = true;
    letterScene.classList.remove('leaving');
    startQuiz();
  }, 450);
});

// quiz
let qIndex = 0;
let score = 0;
const quizScene = document.getElementById('quizScene');

function startQuiz(){
  qIndex = 0;
  score = 0;
  document.getElementById('quizTitle').textContent = CONFIG.quizTitle;
  document.getElementById("quizIntro").textContent = CONFIG.quizIntro;
  quizScene.hidden = false;
  requestAnimationFrame(() => quizScene.classList.add('visible'));
  updateProgress('quiz');
  renderQuestion();
}

const quizNextBtn = document.getElementById('quizNextBtn');

function renderQuestion(){
  const total = CONFIG.quizQuestions.length;
  const q = CONFIG.quizQuestions[qIndex];
  // Ocultar la introducción si no es la primera pregunta
  const introEl = document.getElementById('quizIntro');
  if (qIndex === 0) {
    introEl.style.display = 'block'; // Muestra en la pregunta 1
  } else {
    introEl.style.display = 'none';  // Oculta en las demás
  }
  document.getElementById('qProgress').textContent = `Pregunta ${qIndex+1} de ${total}`;
  document.getElementById('quizQuestion').textContent = q.question;
  document.getElementById('quizFeedback').textContent = '';
  quizNextBtn.style.display = 'none';
  const opts = document.getElementById('quizOptions');
  opts.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = opt;
    b.addEventListener('click', () => answer(i, b));
    opts.appendChild(b);
  });
}

function answer(i, btn){
  const q = CONFIG.quizQuestions[qIndex];
  const total = CONFIG.quizQuestions.length;
  const allBtns = document.querySelectorAll('#quizOptions .option-btn');
  allBtns.forEach(b => b.disabled = true);
  const feedback = document.getElementById('quizFeedback');
  feedback.classList.remove('show');
  if(i === q.correctIndex){
    btn.classList.add('correct');
    feedback.textContent = q.feedbackCorrect;
    score++;
  } else {
    btn.classList.add('wrong');
    allBtns[q.correctIndex].classList.add('correct');
    feedback.textContent = q.feedbackWrong;
  }
  requestAnimationFrame(() => feedback.classList.add('show'));
  // el mensaje se queda en pantalla hasta que ella toque "Siguiente"
  quizNextBtn.textContent = (qIndex + 1 < total) ? 'Siguiente →' : 'Ver mensaje final →';
  quizNextBtn.style.display = 'inline-block';
}

quizNextBtn.addEventListener('click', () => {
  qIndex++;
  if(qIndex < CONFIG.quizQuestions.length){
    renderQuestion();
  } 
  else {
    quizScene.classList.remove('visible');
    quizScene.classList.add('leaving');
    setTimeout(() => {
      quizScene.hidden = true;
      quizScene.classList.remove('leaving');
      showScore();
    }, 450);
  }
});

// resultado / puntaje (el "susto" de no poder ver el mensaje si el puntaje es bajo)
const SCORE_THRESHOLD = 70; // % mínimo para "aprobar" — es solo de mentira, igual se ve el mensaje
const scoreScene = document.getElementById('scoreScene');

function showScore(){
  const total = CONFIG.quizQuestions.length;
  const pct = total > 0 ? Math.round((score/total)*100) : 100;
  const passed = pct >= SCORE_THRESHOLD;
  document.getElementById('scoreTitle').textContent = passed ? '¡Lo lograste!' : 'Uy...';
  document.getElementById('scoreCircle').textContent = pct + '%';
  document.getElementById('scoreStamp').classList.toggle('low', !passed);
  let scoreMsg;
  if(pct === 100) scoreMsg = 'me conocés perfecto. ¡Puntaje ideal!';
  else if(passed) scoreMsg = 'no está nada mal, ¡sobre todo conociendote a vos y a tú memoria..!';
  else scoreMsg = 'menos de lo que esperaba...';
  document.getElementById('scoreText').innerHTML =
    `Acertaste <strong>${score} de ${total}</strong> preguntas — ${scoreMsg}`;
  const hasPhotos = CONFIG.photos && CONFIG.photos.items && CONFIG.photos.items.length > 0;
  const nextLabel = hasPhotos ? 'Seguir →' : 'Ver mensaje final →';
  const extra = document.getElementById('scoreExtraText');
  extra.innerHTML = '';
  const contBtn = document.getElementById('scoreContinueBtn');

  if(passed){
    const p = document.createElement('p');
    p.innerHTML = 'Lo lograste. ✨<br><br>Ya no queda ninguna prueba más. Ahora sí... seguí y descubrí el último mensaje que preparé.';
    extra.appendChild(p);
    contBtn.textContent = nextLabel;
    
    // Si aprueba, el botón se muestra normalmente
    contBtn.style.display = 'block'; 
    contBtn.style.margin = '20px auto 0';
  } else {
    // --- TEXTO NUEVO CON SUSPENSO ---
    const p1 = document.createElement('p');
    p1.textContent = 'Bueno... parece que no fue suficiente.';
    extra.appendChild(p1);
    const p2 = document.createElement('p');
    p2.textContent = 'Una pena... porque lo que sigue era, probablemente, la parte más importante de todo este regalo.';
    extra.appendChild(p2);
    const p3 = document.createElement('p');
    p3.textContent = 'Había algunas palabras que reservé especialmente para el final y que solo iban a aparecer después de superar esta última prueba.';
    extra.appendChild(p3);
    const p4 = document.createElement('p');
    p4.textContent = 'Supongo que esta vez van a tener que quedarse guardadas en el recuerdo...';
    extra.appendChild(p4);
    contBtn.textContent = hasPhotos ? 'Seguir igual →' : 'Ver igual el mensaje →';
    // --- ACÁ ESTÁ LA MAGIA DEL TIEMPO ---
    // 1. Ocultamos el botón
    contBtn.style.display = 'none';
    // 2. Le decimos que espere 10 segundos (10000 milisegundos) para mostrarlo
    setTimeout(() => {
      contBtn.style.display = 'block';
      contBtn.style.margin = '30px auto 0';
      
      // Hacemos que la pantalla baje un poquito por si el botón queda fuera de vista
      const escena = contBtn.closest('.scene');
      if(escena) escena.scrollTo({ top: escena.scrollHeight, behavior: 'smooth' });
    }, 20000);
  }
  updateProgress('resultado');
  scoreScene.hidden = false;
  requestAnimationFrame(() => scoreScene.classList.add('visible'));
}

document.getElementById('scoreContinueBtn').addEventListener('click', () => {
  scoreScene.classList.remove('visible');
  scoreScene.classList.add('leaving');
  setTimeout(() => {
    scoreScene.hidden = true;
    scoreScene.classList.remove('leaving');
    const hasPhotos = CONFIG.photos && CONFIG.photos.items && CONFIG.photos.items.length > 0;
    if(hasPhotos) showPhotos(); else showFinal();
  }, 450);
});

// ---- fotos (opcional) ----
function showPhotos(){
  document.getElementById('photosTitle').textContent = CONFIG.photos.title || '';
  document.getElementById('photosIntro').textContent = CONFIG.photos.intro || '';
  const gallery = document.getElementById('photoGallery');
  gallery.innerHTML = '';
  
  CONFIG.photos.items.forEach(photo => {
    const card = document.createElement('div');
    card.className = 'polaroid';
    card.style.cursor = 'zoom-in'; // Cambia el puntero a una lupa
    
    const img = document.createElement('img');
    img.src = photo.src;
    img.alt = photo.caption || '';
    card.appendChild(img);
    
    if(photo.caption){
      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = photo.caption;
      card.appendChild(cap);
    }
    
    // Agregamos el evento del clic para agrandar la foto
    card.addEventListener('click', () => {
      abrirFoto(photo.src, photo.caption);
    });
    gallery.appendChild(card);
  });
  
  updateProgress('fotos');
  const photosScene = document.getElementById('photosScene');
  photosScene.hidden = false;
  requestAnimationFrame(() => photosScene.classList.add('visible'));
}

document.getElementById('photosContinueBtn').addEventListener('click', () => {
  const photosScene = document.getElementById('photosScene');
  photosScene.classList.remove('visible');
  photosScene.classList.add('leaving');
  setTimeout(() => {
    photosScene.hidden = true;
    photosScene.classList.remove('leaving');
    showFinal();
  }, 450);
});

// final
function showFinal(){
  document.getElementById('finalTitle').textContent = CONFIG.finalTitle;
  const box = document.getElementById('finalText');
  box.innerHTML = '';
  // --- LA CLAVE ESTÁ ACÁ ---
  // Reiniciamos la variable a 'false' para obligar a la máquina a escribir de a poco
  skipTyping = false;
  // Llamamos a nuestra función que escribe letra por letra
  typeParagraphs(box, CONFIG.finalParagraphs, 0);
  document.getElementById('finalSignature').textContent = CONFIG.finalSignature;
  
  const finalScene = document.getElementById('finalScene');
  finalScene.hidden = false;
  requestAnimationFrame(() => finalScene.classList.add('visible'));
  updateProgress('final');

  const petals = document.getElementById('petals');
  for(let i=0;i<18;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = '♡';
    p.style.left = Math.random()*100+'vw';
    p.style.animationDuration = (6+Math.random()*6)+'s';
    p.style.animationDelay = (Math.random()*5)+'s';
    p.style.fontSize = (10+Math.random()*10)+'px';
    petals.appendChild(p);
  }
}

// ---- Lógica de la Segunda Carta (Respuesta) ----

// Botón "Continuar" al final de la carta principal
document.getElementById('finalContinueBtn').addEventListener('click', (e) => {
  e.stopPropagation(); // Evita que se saltee el tipeo accidentalmente
  
  // Oculta el botón continuar
  document.getElementById('finalContinueBtn').style.display = 'none';
  
  // Muestra la segunda carta
  const replyPaper = document.getElementById('replyPaper');
  replyPaper.classList.add('show-reply-paper');
  
  // Resetea la variable y empieza a tipear los textos opcionales
  skipTyping = false;
  const replyContainer = document.getElementById('replyTextContainer');
  replyContainer.innerHTML = '';
  typeParagraphs(replyContainer, CONFIG.replyParagraphs, 0);

  // Baja suavemente la pantalla para que la carta nueva quede a la vista
  setTimeout(() => {
    replyPaper.scrollIntoView({ behavior: 'smooth', block: 'end' });

});

// Botones de Sí / No
document.getElementById('btnYes').addEventListener('click', () => {
  document.getElementById('replyPrompt').style.display = 'none';
  const form = document.getElementById('replyForm');
  form.style.display = 'flex';
  form.style.animation = 'paperFadeIn 0.8s ease forwards';
});

document.getElementById('btnNo').addEventListener('click', () => {
  document.getElementById('replyPrompt').style.display = 'none';
  const hintText = document.getElementById('replyTextContainer');
  hintText.style.animation = 'paperFadeIn 0.6s ease forwards';
  // Reemplazamos el texto con el mismo formato de los párrafos escritos
  hintText.innerHTML = "<p class='letter-p' style='text-align:center;'>¡Me parece perfecto! Guardalo para cuando nos veamos. 😊</p>";
});

// ---- Botón de Enviar (Opción 1: Correo silencioso) ----
document.getElementById('replyBtn').addEventListener('click', async () => {
  const text = document.getElementById('replyText').value.trim();
  const btn = document.getElementById('replyBtn');
  
  // ACÁ TENÉS QUE PEGAR LA CLAVE QUE TE LLEGÓ AL CORREO
  const tuAccessKey = "8b3da7c0-cf6e-4ffd-9f94-174599281f26"; 
  
  if(text !== "") {
    // Cambiamos el botón para que vea que está cargando
    const textoOriginal = btn.textContent;
    btn.textContent = "Enviando... ⏳";
    btn.disabled = true;
    btn.style.opacity = "0.7";

    try {
      const response = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json"
        },
        body: JSON.stringify({
          access_key: tuAccessKey,
          subject: "💌 ¡Nuevo mensaje de Karen de la carta sorpresa!",
          message: text
        })
      });

      const result = await response.json();

      if (result.success) {
        // Si se envió bien, hacemos un efecto lindo y mostramos un mensaje de éxito
        const form = document.getElementById('replyForm');
        form.style.animation = "paperFadeIn 0.5s ease backwards";
        form.innerHTML = "<p style='font-family: var(--hand); font-size: 1.6rem; color: var(--rose); text-align: center; margin-top: 20px;'>¡Mensaje enviado con éxito! 💌</p>";
      } else {
        alert("Uy, hubo un error al enviarlo. Por las dudas, decímelo en persona 😊");
        btn.textContent = textoOriginal;
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    } catch (error) {
      alert("Parece que hay un problema de conexión. Revisá tu internet y probá de nuevo.");
      btn.textContent = textoOriginal;
      btn.disabled = false;
      btn.style.opacity = "1";
    }
  } else {
    alert("¡Escribí algo primero! 😊");
  }
});

// Permitir saltear el tipeo rápido si hace click en la pantalla final
document.getElementById('finalScene').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA') {
    skipTyping = true;
  }
});

// ---- Lógica del Teclado de Emojis ----
const emojisArray = ['😀','😂','🥰','😍','😊','🥺','😉','😎','🤩','😘','😜','🤭','😭','❤️','✨','🔥','🎉','👍','🙌','🫶'];
const emojiPicker = document.getElementById('emojiPicker');
const replyText = document.getElementById('replyText');
const emojiToggleBtn = document.getElementById('emojiToggleBtn');

// Generar los emojis dentro del panel
if (emojiPicker) {
  emojisArray.forEach(emp => {
    const span = document.createElement('span');
    span.className = 'emoji-item';
    span.textContent = emp;
    span.addEventListener('click', (e) => {
      e.stopPropagation(); // Evita que el panel se cierre al tocar el emoji
      // Insertar el emoji justo donde está el cursor en el texto
      const start = replyText.selectionStart;
      const end = replyText.selectionEnd;
      const text = replyText.value;
      replyText.value = text.substring(0, start) + emp + text.substring(end);
      // Mover el cursor justo después del emoji insertado
      replyText.selectionStart = replyText.selectionEnd = start + emp.length;
      replyText.focus();
    });
    emojiPicker.appendChild(span);
  });
}

// Abrir y cerrar el panel con el botón
if (emojiToggleBtn) {
  emojiToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation(); // Evita que el click se propague
    emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'grid' : 'none';
  });
}

// Cerrar el panel si se hace click en cualquier otra parte de la pantalla
document.addEventListener('click', (e) => {
  if (emojiPicker && emojiPicker.style.display === 'grid') {
    if (!e.target.closest('#emojiPicker') && e.target.id !== 'emojiToggleBtn') {
      emojiPicker.style.display = 'none';
    }
  }
});

// ---- Sonido al escribir en la caja de texto opcional ----
const replyTextArea = document.getElementById('replyText');
if (replyTextArea) {
  // Usamos el evento 'input' porque funciona perfecto tanto en PC como en celulares
  replyTextArea.addEventListener('input', (e) => {
    // Verificamos qué tipo de tecla apretó
    if (e.inputType === 'insertLineBreak') {
      // Si apretó "Enter" (salto de línea) hace el sonido de la campanita
      AudioFX.playReturn();
    } else if (e.data === ' ') {
      // Si apretó la barra espaciadora
      AudioFX.playSpaceBar();
    } else {
      // Para cualquier otra letra, número o incluso si borra texto
      AudioFX.playTick();
    }
  });
}

// ---- Lógica para el Visor de Fotos ----
const photoModal = document.getElementById('photoModal');
const modalImg = document.getElementById('modalImg');
const modalCaption = document.getElementById('modalCaption');
const modalPolaroid = document.getElementById('modalPolaroid'); // <-- Nueva variable

function abrirFoto(src, caption) {
  modalImg.src = src;
  modalCaption.textContent = caption || '';
  photoModal.style.display = 'flex';
  
  // Reiniciamos el tamaño de la foto para que haga el efecto de salto
  modalPolaroid.style.transform = 'scale(0.8)';
  
  // Pequeño delay para que la transición funcione suave
  requestAnimationFrame(() => {
    photoModal.style.opacity = '1';
    modalPolaroid.style.transform = 'scale(1)'; // <--- La foto salta hacia el frente
  });
}

function cerrarFoto() {
  photoModal.style.opacity = '0'; // Primero desvanece el fondo
  modalPolaroid.style.transform = 'scale(0.8)'; // La foto se achica hacia atrás
  
  setTimeout(() => {
    photoModal.style.display = 'none'; // Luego lo oculta del todo
  }, 300);
}

// Cierra la foto al hacer clic en cualquier parte de la pantalla
if (photoModal) {
  photoModal.addEventListener('click', () => {
    cerrarFoto();
  });
}

// ---- Lógica para abrir las fotos del fondo ----
const backgroundPolaroids = document.querySelectorAll('.bg-polaroid');

backgroundPolaroids.forEach(polaroid => {
  polaroid.addEventListener('click', () => {
    const img = polaroid.querySelector('img');
    if (img) {
      // Usamos el 'alt' de la imagen como texto para la foto grande
      abrirFoto(img.src, img.alt); 
    }
  });
});
